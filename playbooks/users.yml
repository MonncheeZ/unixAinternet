---
- name: User & SSH keys
  hosts: dol
  become: true

  tasks:
    - name: User exists
      ansible.builtin.user:
        name: "{{ admin_user_name }}"
        state: present
        update_password: on_create

    - name: Set keys
      ansible.posix.authorized_key:
        user: "{{ admin_user_name }}"
        key: "{{ admin_user_ssh_keys | join('\n') }}"
        exclusive: true
        state: present